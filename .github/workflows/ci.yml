name: ci

permissions:
  contents: read

on:
  push:
  pull_request:
  # GitHub dropped a push event once and there was no way to re-run without an
  # empty commit. This adds a manual trigger: gh workflow run ci
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tags: ['', purego, diagnostic]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - run: go vet -tags="${{ matrix.tags }}" ./...
      - run: go build -tags="${{ matrix.tags }}" ./...
      - run: go test -short -tags="${{ matrix.tags }}" ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - run: go test -short -race ./...

  python-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.2
      - run: python -m unittest discover -s py -p "test_*.py"

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r py/requirements.txt --no-deps --disable-pip
