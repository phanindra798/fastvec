name: ci

on:
  push:
  pull_request:
  # GitHub dropped a push event once and there was no way to re-run without an
  # empty commit. This adds a manual trigger: gh workflow run ci
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
